# Render Blueprint for Meridian.
#
# Layout: three services + one managed Postgres.
#   - meridian-db   → managed Postgres (private)
#   - meridian-ml   → FastAPI risk-scoring microservice (public web service,
#                     but every /score request requires a shared-secret header)
#   - meridian-api  → Java 21 / Spring Boot backend, built from a Dockerfile
#                     (public web service; REST + STOMP-over-WebSocket)
#   - meridian-web  → Vite static site (public)
#
# Render's free tier does not support private services (type: pserv), so the
# ML scorer runs as a normal public web service. To keep it from being open
# to the internet, /score requires an `X-Internal-Secret` header that matches
# ML_INTERNAL_SECRET. The api sends it automatically; anyone else gets a 401.
# See DECISIONS.md for the tradeoff.
#
# Schema migrations run automatically: Flyway applies them during the api's
# startup, before it begins serving, so there is no separate migration step.
#
# Manual steps (see RENDER_DEPLOY.md):
#   1. After first deploy, copy the *.onrender.com URLs Render assigned and
#      update WEB_ORIGIN / ALLOWED_ORIGINS (on api) and VITE_API_BASE (on web).
#   2. Wire GitHub App credentials via the dashboard for the api service.
#   3. Bootstrap the first admin once — set ADMIN_EMAIL / ADMIN_PASSWORD and run
#      the api with `--seed` from the Render Shell (see RENDER_DEPLOY.md).

databases:
  - name: meridian-db
    databaseName: meridian
    user: meridian
    plan: free                # bump to `starter` or higher for prod
    # Matches the running instance. Changing this does not upgrade a database
    # that already exists — Render only applies it at creation.
    postgresMajorVersion: 15
    ipAllowList: []           # Render's internal network only

services:
  # ---------------------------------------------------------------------------
  # ML — Python FastAPI, public but shared-secret gated
  # ---------------------------------------------------------------------------
  - type: web                 # public web service (free tier has no pserv)
    name: meridian-ml
    runtime: python
    plan: free
    rootDir: apps/ml
    buildCommand: pip install -r requirements.txt && python -m app.train
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
      - key: LOG_LEVEL
        value: info
      - key: ENV
        value: production
      # Model is baked at build time (see buildCommand). If you'd rather train
      # on boot (slower cold-start), flip this to yes and drop `python -m app.train`
      # from the build command.
      - key: ALLOW_TRAIN_ON_BOOT
        value: "no"
      # ML has no browser origin — only the API talks to it.
      - key: ALLOWED_ORIGINS
        value: ""
      # Shared secret required on /score. Auto-generated by Render; the api
      # service references the SAME value below via `fromService` so both sides
      # always agree without a manual copy-paste.
      - key: ML_INTERNAL_SECRET
        generateValue: true

  # ---------------------------------------------------------------------------
  # API — Java 21 / Spring Boot, PUBLIC
  # ---------------------------------------------------------------------------
  # Runs from a Dockerfile rather than a native runtime: Render has no first-class
  # Java runtime, and the image pins the JDK used to build and the JRE used to run.
  # See apps/api/Dockerfile.
  - type: web
    name: meridian-api
    runtime: docker
    plan: free                # bump to `starter`+ for prod (avoids cold spin-down)
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    autoDeploy: true
    healthCheckPath: /health/ready
    envVars:
      # Selects application-prod.yml, which enables secure cookies, forwarded-header
      # handling and the fail-fast secret checks.
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 10000            # Render default; bound to server.port
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info

      # === DB ===
      - key: DATABASE_URL
        fromDatabase:
          name: meridian-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

      # === Auth / secrets — auto-generated by Render, unique per env ===
      - key: JWT_SECRET
        generateValue: true       # 32+ char random string

      # === ML service wiring ===
      # ML runs as a public web service on the free tier (no pserv support), so
      # the api reaches it at its assigned onrender.com URL. Fill this in from
      # the Render dashboard after the first Blueprint apply (e.g.
      # https://meridian-ml.onrender.com). See RENDER_DEPLOY.md.
      - key: ML_SERVICE_URL
        sync: false
      # Shared secret sent as `X-Internal-Secret` on every /score call. Bound
      # to the same generated value the ml service uses, so they can't drift.
      - key: ML_INTERNAL_SECRET
        fromService:
          type: web
          name: meridian-ml
          envVarKey: ML_INTERNAL_SECRET

      # === CORS / cookies ===
      # First deploy: leave placeholder; after Render assigns the web URL, put
      # it here (e.g. https://meridian-web.onrender.com). See RENDER_DEPLOY.md.
      - key: WEB_ORIGIN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

      # === GitHub App / OAuth — paste values in dashboard after service exists ===
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CALLBACK
        sync: false               # e.g. https://meridian-api.onrender.com/auth/github/callback
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true       # then paste the generated value into GitHub App config

      # === Admin bootstrap ===
      # Read only when the service is started with `--seed` (or MERIDIAN_SEED=true),
      # which creates the first org and admin user. Ordinary boots ignore them.
      # See RENDER_DEPLOY.md for the one-off bootstrap run.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # === Optional integrations ===
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false

      # === Rate limiting (defaults are sensible; override if needed) ===
      - key: RATE_LIMIT_AUTH_MAX
        value: "10"
      - key: RATE_LIMIT_API_MAX
        value: "300"

      # Never enable this in prod. Kept explicit so it can't drift — and the app
      # refuses to start under the prod profile if it is ever set true.
      - key: ALLOW_UNSIGNED_WEBHOOKS
        value: "false"

  # ---------------------------------------------------------------------------
  # WEB — Vite static site, PUBLIC
  # ---------------------------------------------------------------------------
  - type: web
    name: meridian-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # SPA fallback → serve index.html for client-side routes.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      # After first deploy: set this to the api URL Render assigned
      # (e.g. https://meridian-api.onrender.com). Build-time only.
      - key: VITE_API_BASE
        sync: false
    headers:
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
