# Production profile.
#
# Everything the old env.js enforced when NODE_ENV=production is enforced here,
# either by these defaults or by StartupChecks (which fails the boot outright
# on a missing JWT_SECRET / DATABASE_URL / GITHUB_WEBHOOK_SECRET).

spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}

logging:
  level:
    root: ${LOG_LEVEL:info}
    com.meridian.api: ${LOG_LEVEL:info}

server:
  # Behind Render's ingress; honour X-Forwarded-* so rate-limit client IPs and
  # secure-cookie detection are correct. Equivalent to `app.set('trust proxy', 1)`.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

meridian:
  cookie-secure: true
  # The web and api services are separate *.onrender.com subdomains, and onrender.com is on the
  # Public Suffix List — so they are different *sites* and a Lax cookie would never be sent on the
  # SPA's requests. None requires Secure, set above. See DECISIONS.md § Split-origin cookies.
  cookie-same-site: ${COOKIE_SAME_SITE:None}
  trust-proxy: ${TRUST_PROXY:true}
  expose-error-details: false
  # No fallback — absence is a boot failure, not a default.
  jwt:
    secret: ${JWT_SECRET:}
  github:
    allow-unsigned-webhooks: false
